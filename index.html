<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Shelf Websites | Premium Web Solutions</title>
    <style>
        /* Warm & Welcoming Reset & Design Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --primary: #e11d48; /* Warm Rose Accent */
            --primary-hover: #be123c;
            --accent: #f59e0b; /* Sunny Warm Gold */
            --dark: #1e1b4b; /* Deep Cozy Navy instead of pitch black */
            --light: #fffbeb; /* Soft Cream Warm Background */
            --text-dark: #374151; /* Soft Charcoal */
            --text-light: #4b5563; /* Warm Muted Gray */
            --white: #ffffff;
            --border: #f3f4f6;
            --shadow-soft: 0 10px 30px -5px rgba(225, 29, 72, 0.04), 0 8px 20px -6px rgba(0, 0, 0, 0.03);
        }

        body {
            background-color: var(--light);
            color: var(--text-dark);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Navigation Header */
        header {
            background-color: rgba(255, 253, 245, 0.85); /* Tinted transparent cream */
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(217, 119, 6, 0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px; /* Slightly taller for breathing room */
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "✨"; /* Subtle visual anchor */
            font-size: 18px;
        }

        .nav-links {
            display: flex;
            gap: 36px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 16px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            padding: 180px 0 120px 0;
            background: radial-gradient(circle at top right, #fff7ed 0%, var(--light) 100%);
            text-align: center;
        }

        .hero h1 {
            font-size: 52px;
            font-weight: 900;
            color: var(--dark);
            line-height: 1.25;
            max-width: 850px;
            margin: 0 auto 28px auto;
            letter-spacing: -1.5px;
        }

        .hero p {
            font-size: 20px;
            color: var(--text-light);
            max-width: 640px;
            margin: 0 auto 44px auto;
        }

        /* Friendly Rounded Buttons */
        .cta-group {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 16px 36px;
            border-radius: 50px; /* Fully pill-shaped for a friendly feel */
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
            border: 2px solid var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(225, 29, 72, 0.3);
        }

        .btn-secondary {
            background-color: var(--white);
            color: var(--dark);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: #fff7ed;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* Features/Benefits Section */
        .features {
            padding: 120px 0;
            background-color: var(--white);
            border-radius: 40px 40px 0 0; /* Smooth structural section curve */
            position: relative;
            z-index: 10;
            box-shadow: 0 -10px 30px rgba(30, 27, 75, 0.02);
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 18px;
            max-width: 500px;
            margin: 0 auto 64px auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 32px;
        }

        .card {
            padding: 44px;
            border-radius: 24px; /* Inviting rounded borders */
            background-color: #fffdf9;
            border: 1px solid #fef3c7;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-soft);
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px -10px rgba(245, 158, 11, 0.15);
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .card h3 {
            font-size: 22px;
            color: var(--dark);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .card p {
            color: var(--text-light);
            font-size: 16px;
        }

        /* Warm Welcoming Lead Capture Section */
        .lead-capture {
            padding: 120px 0;
            background: linear-gradient(135deg, var(--dark) 0%, #1e1e2f 100%);
            color: var(--white);
            text-align: center;
            border-radius: 40px 40px 0 0;
        }

        .lead-capture h2 {
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .lead-capture p {
            color: #cbd5e1;
            margin-bottom: 44px;
            font-size: 18px;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        .form-wrapper {
            max-width: 520px;
            margin: 0 auto;
        }

        .form-group {
            display: flex;
            gap: 16px;
            background-color: rgba(255, 255, 255, 0.08);
            padding: 8px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .form-group input {
            flex: 1;
            padding: 14px 24px;
            border-radius: 100px;
            border: none;
            background: transparent;
            color: var(--white);
            font-size: 16px;
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:focus {
            outline: none;
        }

        .form-group .btn-primary {
            padding: 14px 32px;
        }

        /* Footer */
        footer {
            padding: 50px 0;
            background-color: var(--white);
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 15px;
            color: var(--text-light);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .hero h1 { font-size: 38px; }
            .form-group { 
                flex-direction: column; 
                background: transparent;
                border: none;
                padding: 0;
                gap: 12px;
            }
            .form-group input {
                background-color: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">Top Shelf Websites</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </header>

    <!-- Main Hero -->
    <section class="hero">
        <div class="container">
            <h1>We build beautiful, high-performing websites that just work.</h1>
            <p>A friendly, modern approach to launching your online presence with speed, care, and absolute peace of mind.</p>
            <div class="cta-group">
                <a href="contact.html" class="btn btn-primary">Let's Get Started</a>
                <a href="services.html" class="btn btn-secondary">See Our Work</a>
            </div>
        </div>
    </section>

    <!-- Features Section -->
    <section id="features" class="features">

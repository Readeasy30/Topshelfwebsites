<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Top Shelf Websites</title>
    <style>
        /* Modern Minimalist Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --dark: #0f172a;
            --light: #f8fafc;
            --text-dark: #334155;
            --text-light: #64748b;
            --white: #ffffff;
            --border: #e2e8f0;
        }

        body {
            background-color: var(--light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Navigation Header */
        header {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--dark);
        }

        /* Page Hero Section */
        .page-title-section {
            padding: 160px 0 60px 0;
            background: linear-gradient(180deg, var(--white) 0%, var(--light) 100%);
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .page-title-section h1 {
            font-size: 40px;
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .page-title-section p {
            font-size: 18px;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Contact Form Layout */
        .contact-section {
            padding: 80px 0;
            background-color: var(--white);
        }

        .form-card {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--white);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--light);
            color: var(--dark);
            font-size: 16px;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--white);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            background-color: var(--primary);
            color: var(--white);
            border: 1px solid var(--primary);
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        /* Footer */
        footer {
            padding: 40px 0;
            background-color: var(--white);
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 14px;
            color: var(--text-light);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .form-card { padding: 24px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">Top Shelf Websites</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </header>

    <!-- Page Title -->
    <section class="page-title-section">
        <div class="container">
            <h1>Initialize Consultation</h1>
            <p>Connect your business systems directly with modern static architecture deployments.</p>
        </div>
    </section>

    <!-- Form Section -->
    <section class="contact-section">
        <div class="container">
            <div class="form-card">
                <form onsubmit="event.preventDefault(); alert('Lead transmission successful.');">
                    
                    <div class="form-group">
                        <label for="name">Business Contact Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Workspace Email Address</label>
                        <input type="email" id="email" placeholder="name@company.com" required>
                    </div>

                    <div class="form-group">
                        <label for="project">System Requirements Summary</label>
                        <textarea id="project" rows="5" placeholder="Describe your operational or web project infrastructure parameters..." required></textarea>
                    </div>

                    <button type="submit" class="btn">Connect Intake Terminal</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Top Shelf Websites. All structural rights reserved.</p>
        </div>
    </footer>

</body>
</html>
